<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Profile | College ERP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
            color: #263238;
        }
        .profile-card {
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        h1 { color: #234b75; }
        .notice {
            padding: 14px;
            background: #fff8e1;
            border-radius: 6px;
            line-height: 1.6;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 18px;
            background: #234b75;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <main class="profile-card">
        <h1>My Profile</h1>
        <h2>Teacher Profile</h2>
        <p>College ERP System</p>
        <div class="notice">
            Your teacher profile page is available.
            Personal details will appear here after the profile is
            connected to the application's user database.
        </div>
        <a href="/teacher/dashboard">Back to Teacher Dashboard</a>
    </main>
</body>
</html>
