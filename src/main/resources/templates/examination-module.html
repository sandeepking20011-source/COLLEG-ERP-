<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Examination Module | College ERP</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f1f5f9; color: #1e293b; }
        header { background: #17365d; color: white; padding: 20px 28px; }
        main { max-width: 1100px; margin: 24px auto; padding: 24px; background: white; border-radius: 12px; }
        form { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
        label { display: grid; gap: 6px; font-weight: bold; }
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
        button { padding: 11px 18px; background: #17365d; color: white; border: 0; border-radius: 6px; cursor: pointer; }
        .wide { grid-column: 1 / -1; }
        .message { padding: 12px; background: #dcfce7; margin-bottom: 15px; }
        .error { padding: 12px; background: #fee2e2; margin-bottom: 15px; }
        .table-wrap { overflow-x: auto; margin-top: 24px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { padding: 10px; border: 1px solid #cbd5e1; text-align: left; }
        th { background: #e2e8f0; }
        nav { margin-top: 20px; }
        nav a { margin-right: 16px; color: #1d4ed8; }
    </style>
</head>
<body>
<header><h1>College ERP - Examination Module</h1></header>
<main>
    <h2>Schedule Examination</h2>

    <div class="message" th:if="${message}" th:text="${message}"></div>
    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form method="post" action="/admin/examinations/save">
        <label>Exam Name *
            <input type="text" name="examName" maxlength="100" required>
        </label>

        <label>Exam Type
            <select name="examType">
                <option value="">Select type</option>
                <option value="Internal">Internal</option>
                <option value="Mid-Term">Mid-Term</option>
                <option value="Practical">Practical</option>
                <option value="Final">Final</option>
                <option value="Supplementary">Supplementary</option>
            </select>
        </label>

        <label>Course
            <select name="courseId">
                <option value="">No course selected</option>
                <option th:each="course : ${courses}"
                        th:value="${course['course_id']}"
                        th:text="${course['course_code'] + ' - ' + course['course_name']}"></option>
            </select>
        </label>

        <label>Semester
            <input type="number" name="semester" min="1" max="20">
        </label>

        <label>Exam Date
            <input type="date" name="examDate">
        </label>

        <label>Start Time
            <input type="time" name="startTime">
        </label>

        <label>End Time
            <input type="time" name="endTime">
        </label>

        <label>Academic Year
            <input type="text" name="academicYear" maxlength="20" placeholder="2026-2027">
        </label>

        <label>Status
            <select name="status">
                <option value="Scheduled">Scheduled</option>
                <option value="Ongoing">Ongoing</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
            </select>
        </label>

        <div class="wide">
            <button type="submit">Save Examination</button>
        </div>
    </form>

    <div class="table-wrap">
        <h2>Scheduled Examinations</h2>
        <p th:if="${#lists.isEmpty(exams)}">Abhi database mein koi examination record nahi hai.</p>
        <table th:unless="${#lists.isEmpty(exams)}">
            <thead>
            <tr>
                <th>ID</th>
                <th>Exam Name</th>
                <th>Type</th>
                <th>Course</th>
                <th>Semester</th>
                <th>Date</th>
                <th>Time</th>
                <th>Academic Year</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="exam : ${exams}">
                <td th:text="${exam['exam_id']}"></td>
                <td th:text="${exam['exam_name']}"></td>
                <td th:text="${exam['exam_type']}"></td>
                <td th:text="${exam['course_name']}"></td>
                <td th:text="${exam['semester']}"></td>
                <td th:text="${exam['exam_date']}"></td>
                <td><span th:text="${exam['start_time']}"></span> - <span th:text="${exam['end_time']}"></span></td>
                <td th:text="${exam['academic_year']}"></td>
                <td th:text="${exam['status']}"></td>
                <td>
                    <a th:href="@{/admin/examinations/{id}/edit(id=${exam['exam_id']})}">Edit</a>
                    <form th:action="@{/admin/examinations/{id}/delete(id=${exam['exam_id']})}"
                          method="post"
                          style="display:inline;"
                          onsubmit="return confirm('Are you sure you want to delete this examination?');">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav>
        <a href="/admin/dashboard">Admin Dashboard</a>
        <a href="/accountant/dashboard">Accountant Dashboard</a>
        <a href="/">Login</a>
    <a href="/admin/result-generation">Result Generation</a><a href="/admin/student-result-report">Student-wise Result Report</a></nav>
</main>
</body>
</html>
